<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue3 随机灵感页</title>
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        color: #f8fafc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #1e293b 0%, #020617 45%, #000 100%);
      }
      .page { max-width: 920px; margin: 0 auto; padding: 48px 20px; }
      .card {
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.7);
        border-radius: 18px;
        backdrop-filter: blur(8px);
      }
      .hero { padding: 28px; margin-bottom: 22px; }
      .tag { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #38bdf8; }
      h1 { margin: 8px 0 14px; font-size: clamp(30px, 4vw, 44px); }
      .idea { margin: 0 0 10px; font-size: 20px; }
      .mood { margin: 0 0 20px; color: #cbd5e1; }
      button {
        border: none; border-radius: 999px; padding: 10px 16px;
        color: #0f172a; background: linear-gradient(90deg, #22d3ee, #38bdf8);
        cursor: pointer; font-weight: 700;
      }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
      .mini { padding: 18px; }
      h2 { margin: 0 0 8px; font-size: 17px; color: #e2e8f0; }
      .mini p { margin: 0; color: #94a3b8; }
    </style>
  </head>
  <body>
    <div id="app" class="page">
      <section class="hero card">
        <p class="tag">Vue 3 随机页面</p>
        <h1>今日灵感</h1>
        <p class="idea">{{ current.idea }}</p>
        <p class="mood">心情：{{ current.mood }}</p>
        <button @click="refresh">再来一个</button>
      </section>

      <section class="grid">
        <article v-for="item in picks" :key="item.title" class="card mini">
          <h2>{{ item.title }}</h2>
          <p>{{ item.text }}</p>
        </article>
      </section>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script>
      const ideas = [
        { idea: '把今天的待办写成一首短诗。', mood: '轻松' },
        { idea: '给未来一周设计一个“无手机晚上”。', mood: '专注' },
        { idea: '随机挑一张老照片，写下背后的故事。', mood: '怀旧' },
        { idea: '把早餐配色当成今天穿搭灵感。', mood: '活力' },
        { idea: '用 10 分钟画出“你理想的一天”。', mood: '创造' }
      ];

      const cards = [
        { title: '随机歌单', text: '听一首从未收藏过的歌，然后记录第一感受。' },
        { title: '随机地点', text: '在地图上闭眼点一个地方，了解当地一件趣事。' },
        { title: '随机挑战', text: '今天主动夸奖 3 个不同的人。' },
        { title: '随机问题', text: '如果今天是你电影里的片段，标题会是什么？' },
        { title: '随机微目标', text: '把桌面收拾到只剩 3 样东西。' },
        { title: '随机回忆', text: '写下小学时最难忘的一个午后。' }
      ];

      Vue.createApp({
        data() {
          return { index: Math.floor(Math.random() * ideas.length) };
        },
        computed: {
          current() {
            return ideas[this.index];
          },
          picks() {
            return [...cards].sort(() => Math.random() - 0.5).slice(0, 4);
          }
        },
        methods: {
          refresh() {
            this.index = Math.floor(Math.random() * ideas.length);
          }
        }
      }).mount('#app');
    </script>
  </body>
</html>
